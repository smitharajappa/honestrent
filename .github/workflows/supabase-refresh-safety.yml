name: Refresh incident counts

# Once a month, re-counts reported incidents from the City of Dallas open data and
# updates the database. Counts only. Also runnable by hand.
on:
  schedule:
    - cron: "17 9 5 * *" # 5th of each month, 09:17 UTC
  workflow_dispatch:

concurrency:
  group: supabase-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the database secret exists
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret first (see docs/supabase-automation.md)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Count incidents near each Dallas building
        run: node scripts/make-safety-seed.mjs

      - name: Update the database
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed-safety.sql
