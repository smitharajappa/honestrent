name: Supabase migrations

# Applies new files from supabase/migrations to the hosted database.
# Runs by itself when migrations change on main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      baseline:
        description: "ONE TIME ONLY: mark the migrations you ran by hand as applied, then apply the rest"
        type: boolean
        default: false
      baseline_through:
        description: "With baseline: mark files up to and including this version as already applied"
        type: string
        default: "20261107000000"

# Never run two database updates at once.
concurrency:
  group: supabase-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the database secret exists
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret first (see docs/supabase-automation.md)."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Mark the migrations you ran by hand as already applied (one time)
        if: ${{ inputs.baseline }}
        env:
          THROUGH: ${{ inputs.baseline_through }}
        run: |
          if ! [[ "$THROUGH" =~ ^[0-9]{14}$ ]]; then
            echo "::error::baseline_through must be a 14-digit version like 20261107000000."
            exit 1
          fi
          for f in supabase/migrations/*.sql; do
            version=$(basename "$f" | cut -d_ -f1)
            if [[ "$version" > "$THROUGH" ]]; then
              echo "Leaving $version to be applied"
              continue
            fi
            echo "Marking $version as applied"
            supabase migration repair --status applied --yes "$version" --db-url "$SUPABASE_DB_URL"
          done

      - name: Show what is pending
        run: supabase db push --dry-run --db-url "$SUPABASE_DB_URL"

      - name: Apply new migrations
        run: supabase db push --yes --db-url "$SUPABASE_DB_URL"
